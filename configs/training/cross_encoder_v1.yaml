model:
  name: "michiyasunaga/BioLinkBERT-base"
  num_labels: 1           # single logit output for binary relevance
  max_length: 512         # max sequence length for concatenated (query, trial) pair
  output_dir: "models/cross-encoder/fine-tuned"

training:
  epochs: 3
  batch_size: 16          # smaller than bi-encoder (32) — cross-encoder processes pairs jointly
  learning_rate: 2.0e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  logging_steps: 100
  eval_steps: 2000
  save_steps: 2000
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "CERerankingEvaluator_ndcg@10"

loss:
  type: "BinaryCrossEntropyLoss"

evaluation:
  max_val_samples: 5000   # subsample val triplets for CERerankingEvaluator

data:
  train_file: "data/training/train_pairs.jsonl"
  val_file: "data/training/val_pairs.jsonl"

inference:
  rerank_top_k: 50

mlflow:
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "trialmind-cross-encoder"
  run_tag: "fine-tuning-v1"
