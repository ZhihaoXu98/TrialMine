# Grafana datasource provisioning — auto-loaded at container start so the
# admin doesn't have to point Grafana at Prometheus through the UI.
# uid is fixed (`prometheus`) so dashboards can reference it by uid and
# remain portable across reprovisionings.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s
