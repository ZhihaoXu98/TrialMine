# Tells Grafana to load every JSON dashboard in /var/lib/grafana/dashboards
# at startup. The dashboards/ directory is mounted from
# infrastructure/grafana/dashboards/ by docker-compose.yml.

apiVersion: 1

providers:
  - name: TrialMine
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
