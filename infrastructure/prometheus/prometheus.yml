# Prometheus configuration for the TrialMine demo stack.
# Scraped by the `prometheus` service in docker-compose.yml; service hostnames
# resolve over the default compose network.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    monitor: trialmine

scrape_configs:
  # Self-scrape so Prometheus's own health/build metrics are visible too.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The FastAPI service exposes /metrics via prometheus_client.make_asgi_app().
  # 10s scrape lets the latency-by-stage panel feel close-to-real-time
  # without flooding the time-series store on a single-tenant demo.
  - job_name: trialmine-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
