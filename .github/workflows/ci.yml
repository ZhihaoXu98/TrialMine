name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so PR pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ----------------------------------------------------------------------- #
  # Lint — ruff + mypy on the source tree                                   #
  # ----------------------------------------------------------------------- #
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: Ruff (format check)
        run: ruff format --check src/ tests/

      - name: Mypy
        # Heavy ML stubs are missing — ignore-missing-imports is the
        # pragmatic stance for an ML codebase. We still get type-check
        # coverage on our own annotated code.
        run: mypy src/TrialMine/ --ignore-missing-imports

  # ----------------------------------------------------------------------- #
  # Test — unit + integration suites against an ES service container       #
  # ----------------------------------------------------------------------- #
  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          xpack.security.http.ssl.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    env:
      ELASTICSEARCH_URL: http://localhost:9200
      # The QueryParserAgent constructor fails fast without a key. Tests
      # mock the SDK call itself, but module import paths still touch
      # the constructor — provide a placeholder.
      ANTHROPIC_API_KEY: sk-ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project (with dev extras)
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only torch first — pulls down a ~200 MB wheel from the
          # CPU index, much faster than the default CUDA build.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
          # Test-time deps not pinned in pyproject's dev extras.
          pip install pytest-asyncio mypy

      - name: Wait for Elasticsearch
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:9200/_cluster/health >/dev/null; then
              echo "ES reachable"; exit 0
            fi
            sleep 2
          done
          echo "ES never came up" >&2
          curl -v http://localhost:9200/ || true
          exit 1

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run integration tests
        run: pytest tests/integration/ -v --tb=short

      # ML tests skipif models aren't present — they will all skip in CI by
      # default (~1 GB artefacts not in git). Keep the step so the suite
      # is wired and visible; the run is a no-op until models are uploaded.
      - name: Run ML tests (skip if models absent)
        run: pytest tests/ml/ -v --tb=short

  # ----------------------------------------------------------------------- #
  # Quality gate — NDCG@10 must stay above threshold                        #
  # ----------------------------------------------------------------------- #
  # Soft-skips when labeled queries / models / FAISS index aren't checked
  # into the repo (the default in CI). When all artefacts are available
  # — e.g. a manual workflow_dispatch from a fully provisioned runner —
  # this gate fails the build if NDCG@10 drops below the threshold.
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    env:
      ANTHROPIC_API_KEY: sk-ci-placeholder
      QUALITY_GATE_THRESHOLD: "0.7"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Run quality gate
        run: python scripts/ci_quality_gate.py --threshold "${QUALITY_GATE_THRESHOLD}"
