# Pre-commit hooks for TrialMine.
# Install with: pre-commit install
# Run on all files manually: pre-commit run --all-files
#
# Scope: matches CI — ruff lints / formats only ``src/`` and ``tests/``.
# Notebooks, scripts, data, and config dirs are out of scope so we don't
# rewrite ad-hoc utilities or generated artefacts on every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/.*\.py$
      - id: ruff-format
        files: ^(src|tests)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(src|tests)/.*\.py$
      - id: end-of-file-fixer
        files: ^(src|tests)/.*\.py$
      - id: check-yaml
        # Skip multi-doc / templated YAML (compose anchors, etc.)
        exclude: ^docker-compose\.yml$
      - id: check-merge-conflict
      - id: check-added-large-files
        # 1 MB cap — model artefacts and data files belong in DVC, not git.
        args: [--maxkb=1024]
